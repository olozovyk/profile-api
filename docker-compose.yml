services:
  postgres:
    image: postgres:18.4
    container_name: postgres-profile-api
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5432:5432'
    volumes:
      - pgdata-profile-api:/var/lib/postgresql

volumes:
  pgdata-profile-api:
